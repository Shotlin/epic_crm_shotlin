packages:
  - .

# Electron Forge packages an installed dependency tree. pnpm 11 reads this
# project-level setting from pnpm-workspace.yaml (rather than .npmrc).
nodeLinker: hoisted

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - electron@43.1.1

onlyBuiltDependencies:
  - electron
  - electron-winstaller

overrides:
  electron-to-chromium: 1.5.389
